go2_robottrack:
  ros__parameters:
    mode: dry-run
    rgb_topic: /go2/d435i/color/image_raw
    depth_topic: /go2/d435i/aligned_depth_to_color/image_raw
    command_topic: /go2/robottrack/cmd_vel_raw
    server_url: http://127.0.0.1:5801/eval_dual
    instruction: Follow the person ahead
    model_input_mode: center_crop_height
    model_crop_size: 384
    jpeg_quality: 60
    http_timeout_s: 30.0
    waypoint_strategy: first
    control_dt: 0.1
    dispatch_hz: 50.0
    max_plan_age_s: 1.5
    max_vx: 0.15
    max_wz: 0.30
    nav_raw_topic: /go2/robottrack/nav_cmd_vel_raw
    robottrack_raw_topic: /go2/robottrack/cmd_vel_raw
    selected_output_topic: /cmd_vel_nav
    selected_source: robottrack
    source_max_age_s: 0.25
    distance_enabled: false
    target_distance_m: 5.0
    min_target_distance_m: 0.5
    max_target_distance_m: 7.0
    distance_deadband_m: 0.25
    distance_kp: 0.25
    distance_max_forward_mps: 0.15
    distance_max_reverse_mps: 0.0
    distance_measurement_max_age_s: 0.60
    distance_identity_max_age_s: 0.25
    distance_min_confidence: 0.50
    distance_pair_max_delta_s: 0.20
    distance_center_fallback: false
    # Drop detections weaker than this before they can become candidates for
    # enrolment or for identity matching.  0.0 keeps everything, which is what
    # the HOG detector already does (its hitThreshold is 0.0, so every box it
    # returns scores above 0.5).  The deployment raises it; see the manifest.
    detector_min_confidence: 0.0
    # Ranger chassis guard: restores the fail-closed command contract that
    # go2_chassis provided internally and that the Ranger chassis primitive
    # does not have, plus the 4WS turn-radius constraint.
    guard_input_topic: /cmd_vel_guarded
    guard_output_topic: /cmd_vel
    guard_forward_only: true
    guard_max_vx_mps: 0.25
    guard_max_wz_rps: 0.40
    guard_max_linear_accel_mps2: 0.30
    guard_max_angular_accel_rps2: 0.80
    guard_command_timeout_s: 0.25
    guard_publish_hz: 50.0
    guard_min_turn_radius_m: 0.81
    guard_turn_policy: clamp_yaw
    guard_spin_vx_epsilon_mps: 0.02
